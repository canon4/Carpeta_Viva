# Solo para demo local. En el VPS, backend y frontend se despliegan como apps separadas en
# Dokploy, sin este compose (ver docs/adr/0012-despliegue-dokploy.md).
name: carpeta-viva

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  fuseki:
    image: secoresearch/fuseki:6.2.0
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD}
      ENABLE_DATA_WRITE: "true"
      ENABLE_UPDATE: "true"
    volumes:
      - fuseki_databases:/fuseki-base/databases
      - fuseki_configuration:/fuseki-base/configuration
      - fuseki_backups:/fuseki-base/backups
    ports:
      - "127.0.0.1:3030:3030"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      fuseki:
        condition: service_started
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      FUSEKI_URL: http://fuseki:3030/ds
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
      ARCHIVOS_DIR: /data/archivos
      ARCHIVOS_CLAVE_MAESTRA: ${ARCHIVOS_CLAVE_MAESTRA}
      # Alertas de evasión (ADR-0009)
      POLICIA_INFANCIA_TELEFONO: ${POLICIA_INFANCIA_TELEFONO}
      # Asistente de IA (ADR-0010): LLM externo intercambiable + embeddings locales
      IA_LLM_PROVEEDOR: ${IA_LLM_PROVEEDOR:-anthropic}
      IA_LLM_MODELO: ${IA_LLM_MODELO:-claude-haiku-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      IA_EMBEDDINGS_MODELO: ${IA_EMBEDDINGS_MODELO:-intfloat/multilingual-e5-small}
      IA_EMBEDDINGS_VERSION: ${IA_EMBEDDINGS_VERSION:-1}
      IA_ANONIMIZADO_POR_DEFECTO: ${IA_ANONIMIZADO_POR_DEFECTO:-true}
      IA_INDEXAR_AUTOMATICAMENTE: ${IA_INDEXAR_AUTOMATICAMENTE:-true}
      IA_INDEXACION_PENDIENTE_UMBRAL_MINUTOS: ${IA_INDEXACION_PENDIENTE_UMBRAL_MINUTOS:-60}
    volumes:
      - archivos:/data/archivos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # config.json se lee en tiempo de ejecución (nunca se compila, ver frontend/CLAUDE.md).
      # Este archivo pisa el que el Dockerfile copió al construir la imagen, que es el de
      # desarrollo local (public/config.json, con accesosRapidosDesarrollo en true) — en
      # Docker/VPS siempre debe quedar el de aquí, con los accesos rápidos desactivados.
      - ./infra/frontend/config.json:/usr/share/nginx/html/config.json:ro
    ports:
      - "8080:80"

  # Datos sintéticos de demo (NO activar en un entorno que pueda llegar a ser producción).
  # No se levanta con `docker compose up`: solo con el perfil "demo" explícito, p. ej.
  #   docker compose --profile demo up -d seed
  # o, sin perfil, a mano contra un stack ya corriendo:
  #   docker compose exec backend python scripts/seed_sintetico.py
  seed:
    build: ./backend
    profiles: ["demo"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ARCHIVOS_CLAVE_MAESTRA: ${ARCHIVOS_CLAVE_MAESTRA}
    command: ["python", "scripts/seed_sintetico.py"]

volumes:
  pgdata:
  fuseki_databases:
  fuseki_configuration:
  fuseki_backups:
  archivos:
